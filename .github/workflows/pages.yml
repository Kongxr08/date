name: Publish calendar PWA
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'package.json'
      - 'sync-official-holidays.mjs'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official State Council holiday notices
        run: node sync-official-holidays.mjs
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: test-and-upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
